# Builds installers on a tag push (v0.5.0) and attaches them to a GitHub release, plus stable
# "latest" names the install scripts download. macOS artifacts are built on a macOS runner.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win nsis --publish never
          - os: macos-latest
            cmd: npx electron-builder --mac zip dmg --arm64 --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the notes step needs the previous tag
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --no-audit --no-fund
      - run: npm run icon
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Stable names for the install scripts
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          cd release
          for f in Layover-Setup-*.exe; do cp "$f" Layover-Setup.exe; done
          for a in arm64 x64; do for f in Layover-*-mac-$a.zip; do cp "$f" Layover-mac-$a.zip; done; done
          ls -la
          exit 0
      - name: Release notes from the commits since the previous tag
        shell: bash
        run: |
          set +e
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null)
          { if [ -n "$prev" ]; then git log --no-merges --format='- %s' "$prev..${GITHUB_REF_NAME}"; else git log --no-merges --format='- %s' -n 20; fi; } > release/NOTES.md
          cat release/NOTES.md
          exit 0
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release/NOTES.md    # the app shows the release body in its update sheet
          files: |
            release/Layover-Setup*.exe
            release/Layover-*mac*.zip
            release/Layover-*mac*.dmg
