    <linearGradient id="fold-color" x1="299" y1="192" x2="475" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7870ED"/>
      <stop offset="1" stop-color="#7569E9"/>
    </linearGradient>
    <linearGradient id="letter-color" x1="205" y1="145" x2="397" y2="533" gradientUnits="userSpaceOnUse">
      <stop stop-color="#493CDD"/>
      <stop offset="0.55" stop-color="#493DD4"/>
      <stop offset="1" stop-color="#483BD5"/>
    </linearGradient>
  </defs>
  <path id="fold" fill="url(#fold-color)" d="M282 165 L509 411 C502 405 494 402 483 402 H374 C334 394 305 363 305 320 V222 C305 200 297 180 282 165 Z"/>
  <path id="letter-l" fill="url(#letter-color)" d="M153 222 C153 179 188 145 231 145 C272 145 305 179 305 222 V367 C305 389 316 402 338 402 H483 C510 402 525 420 525 447 C525 494 482 533 430 533 H251 C196 533 153 491 153 437 Z"/>
