<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="128 127 424 424" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Layover — original Fold</title>
  <desc id="desc">Editable vector reconstruction of the original Fold concept: a rounded indigo L and a lighter folded plane. Background and inner gap are transparent.</desc>
