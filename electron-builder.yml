appId: com.layover.app
productName: Layover
copyright: Layover
directories:
  output: release
  buildResources: build
files:
  - package.json
  - src/**/*
  - skills/**/*
  - "!**/*.test.js"
extraResources:
  # The CLI runs unpacked so the app's own Node runtime can execute it (ELECTRON_RUN_AS_NODE).
  - from: src
    to: src
  - from: skills
    to: skills
  - from: build/icon.png
    to: icon.png
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
extraFiles:
  # Windows: <install>/bin. macOS: Layover.app/Contents/bin.
  - from: bin
    to: bin
asar: true
mac:
  target:
    - target: zip
      arch: [arm64, x64]
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.developer-tools
  artifactName: Layover-${version}-mac-${arch}.${ext}
  identity: null          # unsigned; the install script clears quarantine
  hardenedRuntime: false
  extendInfo:
    LSUIElement: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Layover-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  runAfterFinish: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Layover
  deleteAppDataOnUninstall: false
